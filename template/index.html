<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String | AI4Devs</title>

    <!--
    ========================================================================
    ESTILOS CSS EMBEBIDOS
    ------------------------------------------------------------------------
    Paleta corporativa (azul marino + grises) para un look profesional
    de ingeniería. CSS embebido en <style> para mantener el ejercicio
    en un solo archivo HTML, sin dependencias externas.
    ========================================================================
    -->
    <style>
        /* Variables de diseño: centralizan colores y medidas */
        :root {
            --color-primario:    #0B1F3A;  /* Azul marino corporativo */
            --color-secundario:  #1E3A5F;  /* Azul medio */
            --color-acento:      #2C5282;  /* Azul interactivo */
            --color-fondo:       #F5F7FA;  /* Gris claro fondo */
            --color-superficie:  #FFFFFF;  /* Blanco tarjetas */
            --color-borde:       #CBD5E0;  /* Gris bordes */
            --color-texto:       #1A202C;  /* Casi negro */
            --color-texto-suave: #4A5568;  /* Gris medio */
            --sombra-tarjeta:    0 4px 20px rgba(11, 31, 58, 0.08);
            --radio:             8px;
        }

        /* Reset básico para uniformidad entre navegadores */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Tipografía y fondo del documento */
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }

        /* Contenedor principal: tarjeta centrada */
        .contenedor {
            width: 100%;
            max-width: 640px;
            background: var(--color-superficie);
            border-radius: var(--radio);
            box-shadow: var(--sombra-tarjeta);
            overflow: hidden;
        }

        /* Encabezado: franja azul marino con título */
        .encabezado {
            background: linear-gradient(135deg, var(--color-primario), var(--color-secundario));
            color: white;
            padding: 32px 40px;
            text-align: center;
        }

        .encabezado h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .encabezado .subtitulo {
            font-size: 14px;
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Cuerpo: zona de instrucciones e interacción */
        .cuerpo {
            padding: 40px;
        }

        .instrucciones {
            text-align: center;
            margin-bottom: 28px;
        }

        .instrucciones h2 {
            font-size: 18px;
            color: var(--color-primario);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .instrucciones p {
            font-size: 15px;
            color: var(--color-texto-suave);
        }

        /* Etiqueta del input */
        .grupo-input {
            margin-bottom: 24px;
        }

        .grupo-input label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primario);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* Renglón para escribir: input estilizado */
        #entrada {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            font-family: inherit;
            color: var(--color-texto);
            background: var(--color-fondo);
            border: 2px solid var(--color-borde);
            border-radius: var(--radio);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #entrada:focus {
            border-color: var(--color-acento);
            box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.15);
        }

        /* Caja de resultado */
        .grupo-resultado label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primario);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        #salida {
            width: 100%;
            min-height: 56px;
            padding: 14px 16px;
            font-size: 20px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: var(--color-primario);
            background: var(--color-fondo);
            border: 2px dashed var(--color-borde);
            border-radius: var(--radio);
            display: flex;
            align-items: center;
            word-break: break-all;
        }

        /* Estado "esperando": texto guía cuando hay menos de 3 letras */
        #salida.esperando {
            color: var(--color-texto-suave);
            font-style: italic;
            font-size: 14px;
            font-family: inherit;
        }

        /* Pie con marca discreta */
        .pie {
            text-align: center;
            padding: 16px 40px 24px;
            font-size: 12px;
            color: var(--color-texto-suave);
            border-top: 1px solid var(--color-borde);
            margin-top: 8px;
        }

        /* Adaptación a móvil */
        @media (max-width: 480px) {
            .encabezado { padding: 24px 24px; }
            .encabezado h1 { font-size: 22px; }
            .cuerpo { padding: 28px 24px; }
        }
    </style>
</head>
<body>

    <!--
    ========================================================================
    ESTRUCTURA DE LA PÁGINA
    ------------------------------------------------------------------------
    Una sola tarjeta central con tres zonas:
      1. Encabezado: título del ejercicio
      2. Cuerpo:     instrucciones + input + resultado
      3. Pie:        crédito AI4Devs
    Los IDs (#entrada, #salida) son los "ganchos" que usará el JS.
    ========================================================================
    -->
    <main class="contenedor">

        <!-- 1. ENCABEZADO -->
        <header class="encabezado">
            <h1>Reverse String</h1>
            <div class="subtitulo">AI4Devs · Ejercicio 01</div>
        </header>

        <!-- 2. CUERPO -->
        <section class="cuerpo">

            <div class="instrucciones">
                <h2>Invierte cualquier cadena de texto</h2>
                <p>Escribe en el campo y la cadena invertida aparecerá<br>
                automáticamente al alcanzar <strong>3 o más caracteres</strong>.</p>
            </div>

            <!-- Renglón para escribir -->
            <div class="grupo-input">
                <label for="entrada">Texto original</label>
                <input
                    type="text"
                    id="entrada"
                    placeholder="Ej. AI4Devs"
                    autocomplete="off"
                    autofocus>
            </div>

            <!-- Caja de resultado en tiempo real -->
            <div class="grupo-resultado">
                <label for="salida">Texto invertido</label>
                <div id="salida" class="esperando">
                    Escribe al menos 3 caracteres…
                </div>
            </div>

        </section>

        <!-- 3. PIE -->
        <footer class="pie">
            Programa AI4Devs · LIDR.co
        </footer>

    </main>

    <!-- Lógica JavaScript: cargada al final para que el HTML ya exista -->
    <script src="script.js"></script>

</body>
</html>
